[pytest]
# 只折叠通过/跳过/预期类结果；失败(failed)与错误(error)行打开报告即展开，直接看 traceback。
render_collapsed = passed,skipped,xfailed,xpassed
testpaths = projects

# 自动生成 HTML 报告：文件名随意，根 conftest 钩子会按测试路径重定向到
# reports/<项目>/<时间戳>/html/ 下（单项目运行时）。跨项目混跑无法唯一识别项目，
# 报告会落到 reports/ 根目录，属预期行为。
addopts = --html=report.html --self-contained-html

# 控制台日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_auto_indent = False

# 文件日志配置
log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# norecursedirs 用 fnmatch_ex 匹配：无路径分隔符的模式只匹配目录 basename，
# 且在 Windows 上大小写不敏感。曾用裸 "Protocols" 会把 UI 测试包
# projects/.../tests/ui/protocols 一并跳过（大小写不敏感 basename 命中），
# 导致整目录 110 条用例静默漏收。这里改为带分隔符的 "autotest/Protocols"，
# 仅锚定仓库根的顶层 Protocols 库（已移至 tools/Protocols），不再误伤嵌套的 protocols 测试包。
norecursedirs = .git .venv __pycache__ autotest/tools/Protocols reports node_modules
python_files = test_*.py TestCase_*.py
python_classes = Test*
python_functions = test_*
markers =
    critical: Core functionality
    smoke: Basic functionality
    ai_v: test_ai_voltage
    ai_c: test_ai_current
    ao_v: test_ao_voltage
    ao_c: test_ao_current
    w_add: test_add_user_flow
    w_delete: test_delete_all_users
    w_update: test_update
    lv0: DataLog highest priority smoke cases (run on every submission)
    lv1: DataLog high priority regression cases
    lv2: DataLog medium priority long-duration file-length cases (on-demand)
    lv4: DataLog boundary / negative cases
    destructive: Changes device state (e.g. factory reset, whitelist) — run with care
    slow: Long-running cases (reboot, sync, multi-step)
    ma: AcuRev-100 mA 表用例 (CT 二次侧 100mA/80mA); AcuRev100/conftest 按 case_map ct_type 自动打标
    mv: AcuRev-100 mV 表用例 (CT 二次侧 333mV, CTEP 专用); 同上自动打标
    rct: AcuRev-100 RCT (Rogowski) 表用例, 独立于 mA/mV; 同上自动打标

[pytest]
testpaths = test_case/

# 控制台日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_auto_indent = False

# 文件日志配置
log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    critical: Core functionality
    smoke: Basic functionality
    ai_v: test_ai_voltage
    ai_c: test_ai_current
    ao_v: test_ao_voltage
    ao_c: test_ao_current
    web2: test_add_user_flow
    web2_add: test_add_user_flow
    web2_delete: test_delete_all_users

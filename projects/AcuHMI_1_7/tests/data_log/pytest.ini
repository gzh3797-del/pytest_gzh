[pytest]
# 控制台日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_auto_indent = False

# 文件日志
log_file = reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 测试文件发现
python_files = TestCase_*.py test_*.py
python_functions = test_*

# Allure 结果收集（每次执行自动清空旧结果，由 conftest.pytest_sessionfinish 生成带时间戳报告）
addopts = --alluredir=reports/allure-results --clean-alluredir

# 标记
markers =
    datalog: DataLog 功能测试
    push: 推送到服务器验证
    disable: Disable 状态验证
    ui: UI 页面验证

# AcuRev-100 手工用例→自动化 映射表(001~009)。工程师确认后作为用例生成的唯一输入。
# 结构: cases[].points[]={source,checks[,checks_instant]}; meter_cfg=用例前置(接线/CT, helper 自动写寄存器); needs_review 非空运行时拒绝执行。
# checks: source_read=现值区间判据 / energy_accumulate=窗口 Δ 增量判据; checks_instant: 仅能量类, 现值区间判据(频率等非累积量)。
# 🔴 重名寄存器必须写地址(2026-07-27 实证): 地址表里 PHASE_A/B/C_CURRENT 同名出现在 Wiring Check 段与 Real Time 段,
#    spec_loader.reg_by_name 取 addrs[0]=Wiring Check 段(不随实时电流刷新) → 电流判据一律写 Real Time 段地址
#    36978/36980/36982, 并用 register_name 注明可读名。新增判据前先查 spec/registers.json 的 by_name 是否多地址。
# ⚠️ 自供电约定(2026-07-08): 电压归零=断表电, 还原=220V/50Hz电流归零; 0V/低压用例标"自供电冲突"。
# 🔴 电流安全(2026-07-09 烧板事故): 源电流上限由 config source.current_injection 硬限幅(via_ct=25A/direct=0.1A)。
# 台体电流 CT = 20A/100mA(2026-07-09 接入): 显示系数=Primary/20; 原 333mV 档用例已换算(ct_type→100mA, 源电流×4)。
# 📏 精度判据口径(2026-07-27): 统一溯源到下方 accuracy_spec(SRS v1.03 §3.5); 改口径先改 accuracy_spec 再同步测点 lo/hi。

# ── 精度判据溯源块: 只读元数据, 运行时不消费(helper 只取 cases), 供人工复核/追溯 ──
accuracy_spec:
  source: 'AcuRev-100_软件需求规格说明书_v1.03 20260709 · §3.5 基础电参量测量'
  synced: '2026-07-27'
  note: '各测点 lo/hi = 期望值(显示域) ± 本表容差; 期望值为0的量(如 Q=0/Eq=0)取同相 S/Es 的容差作绝对带。'
  system_accuracy: 'MC S-E-06(认证, 必须) + ANSI C12 Class 0.5(自测, 不出证) —— 适用于有功功率/有功电能;
    其余分量精度为 SRS 标注"建议"的设计目标, 非独立认证项。'
  resolution: '频率 0.1Hz / 电压 0.1V / 电流 0.1A / 功率 1W / 电能 1Wh / 相角 0.1° —— 属显示域分辨率,
    本表判据走 Modbus 浮点回读(实测4位小数), 不受显示分辨率限制。'
  params:
  - name: Frequency
    srs: '0.01 Hz (45~65Hz); IEC 61557-12 class 0.02(建议)'
    applied: '源设定 ±0.1 Hz(分辨率受限口径, 非 SRS 精度线)'
    register: SYSTEM_FREQUENCY
    remark: '2026-07-27 补(原全表零覆盖): source_read 测点入 checks; energy_accumulate 测点入
      checks_instant(该类 checks 是 Δ 增量判据, 频率属瞬时量必须另立块)。
      ⚠️ SRS 的 0.01Hz 精度在本表无法验证: 20260727_093736 批跑实证 SYSTEM_FREQUENCY 虽为 float32,
      固件只填 0.1Hz 量化值(72 次读数仅 0x42480000=50.0 / 0x42486666=50.1 两个, 无中间值),
      与 SRS 自身"频率分辨率 0.1Hz"一致 → ±0.01Hz 带小于一个刻度, 判据不可测(实测 50.0:50.1=5:7
      在舍入边界抖动, 呈抛硬币式 flaky)。故判据取一个分辨率单位 ±0.1Hz(仅验"频率通道工作且无粗差"),
      SRS 0.01Hz 精度线待需求侧澄清(分辨率与精度矛盾)或改用外部频率计验证。
      遗留观察项: 源设 50.00 时读 50.1 意味测量值≥50.05(达 SRS 精度 5 倍), 但 CL3021 源频率本身
      未独立标定, 源侧/表侧责任需外部频率计才能分离, 现有数据不下结论。
      现有测点源频率全为 50Hz, 45/65Hz 边界待换支持宽频的源后补测点。'
  - name: VLN
    srs: '0.2%(建议)'
    applied: '±0.2%'
    params: 'Van / Vbn / Vcn / Vlnavg'
  - name: VLL
    srs: '0.2%(建议)'
    applied: '±0.2%'
    params: 'Vab / Vbc / Vca / Vllavg'
  - name: I
    srs: '0.2%(建议)'
    applied: '±0.2%'
    params: 'Ia / Ib / Ic / Iavg'
  - name: P
    srs: 'MC S-E-06(必须) + ANSI C12 Class 0.5(自测) → 认证线 ±0.5%'
    applied: '±0.2%'
    remark: '2026-07-27 用户裁决: 判据维持 0.2% 不放宽——0.2% 为工程设计目标(严于 SRS 认证线),
      放宽会掩盖 0.2%~0.5% 区间的劣化。读数超 ±0.5% = 认证口径不符(阻塞级);
      落在 0.2%~0.5% = 工程目标未达标, 按缺陷记录后由工程师裁决是否降级。'
  - name: Q
    srs: '0.5%(建议)'
    applied: '±0.5%×|Q|; 仅期望值为 0 的测点取 ±0.5%×S 绝对带'
    remark: '2026-07-27 用户裁决(按 SRS/config 字面口径): 005 的 13 条非零 Q 判据原按 ±0.5%×S 算
      (Δθ=60° 时 S/|Q|=1/sin60°=1.1547 → 实为 0.577%), 已收紧为 ±0.5%×|Q|, 中心值不变。
      Q=0 的 36 个测点无法照此换算(0.5%×0=零宽度判据不可测), 继续以 S 为参照取绝对带。'
  - name: S
    srs: '0.5%(建议)'
    applied: '±0.5%'
  - name: PF
    srs: '0.2%; 格式可配置(IEC / IEEE 约定)'
    applied: '±0.002 绝对(=0.2%×满度1.0)'
  - name: Angle
    srs: '±0.5°(必须, 分辨率 0.1°)'
    applied: '±0.5°; 0° 点用 ranges 处理 0~360 回绕([0,0.5]∪[359.5,360))'
  - name: Ep
    srs: 'MC S-E-06(必须) + ANSI C12 Class 0.5(自测) → 认证线 ±0.5%'
    applied: '±0.2%'
    remark: '同 P: 维持 0.2% 工程目标, 判读口径见 P 行。'
  - name: Eq
    srs: '0.5%(建议)'
    applied: '±0.5%; 期望值为0时取 [0, 0.5%×Es] 单边带'
  - name: Es
    srs: '0.5%(建议)'
    applied: '±0.5%'


# 来源: knowledge/meters/AcuRev100/testcase/AcuRev-100_接线检查判据_测试用例.xlsx
# 结构: cases[].points[]={source, expect}; meter_cfg=接线方式前置(复用 helpers_accuracy);
#       phase_order=相序配置前置(PHASE_ORDER@4195, 仅 3E4WY 用例携带)。
# 期望: expect.v_code/i_code=错误码期望精确值(12290/12291, 短路逻辑=被跳过位必须为0);
#       expect.i_assert=false 电压缺失类电流码只记录不断言(该相 pf 无定义, 2026-07-14 确认);
#       expect.phase_order=VOLTAGE_PHASE_ORDER@12304 期望(仅用例表预期提及时断言)。
# 触发: 每测点关→开 WIRE_CHECK_SWITCH@12288(0=ON/1=OFF) 触发立即检测(用户裁定 2026-07-14)。

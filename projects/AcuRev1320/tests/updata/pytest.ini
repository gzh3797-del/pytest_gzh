[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = -v -s --show-capture=all --capture=sys
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    auto: 全自动用例（GUI 驱动 + Modbus 回读，可直接跑）
    semi: 半自动用例（升级动作自动化，网络拓扑/配置为物理前置）
    manual: 手动用例（需物理按键/STM32/接源/铅封/HMI 等，自动跳过并附手动步骤）
    rtu: 经 RTU 通道
    tcp: 经 TCP 通道
    stress: 压力/稳定性用例

# DataLog 测试配置
gateway:
  url: "http://192.168.2.94:3030"   # RPP 前端(无后端联调环境)
  username: "admin"
  password: ""                       # 凭据不入库，由 configs/.env 的 WEB_PASSWORD 提供

modbus:
  # Modbus TCP 设备：通过以太网连接，每台设备独立配置 ip / port / unit
  # 键名须与网关 Data Log 文件中的设备 ID 对应（格式：{型号}-{设备ID} 中的设备ID部分）
  # 同一型号多台设备请各自使用唯一键名区分，例如 AcuRev4100_1 / AcuRev4100_2
  #
  # 注意：以下 tcp.devices 静态连接表自 2026-06 起仅作「动态发现失败时的兜底」。
  # 正常运行时 ip/port/unit 由网关 API 动态发现（见 conftest driver + verify_files）。
  tcp:
    devices:
      # 值为 2026-07-02 网关 /api/device/config 实测：
      #   AcuRev4100   ← Acurev1234100（192.168.2.29，在线）
      #   AcuRev4100_2 ← Acurev4100242（192.168.2.242，在线；verifier 的 _DEVICE_MODBUS_KEY
      #                  将 acurev4100 文件映射到第二台，键名须为 AcuRev4100_2）
      #   Acuvim3      ← Acucim3（192.168.2.32，当前离线）
      # AcuvimIIR：当前网关下无该型号设备；AcuRev1300（pxm350）为网关侧 RTU 无法直连，均已移除
      AcuRev4100: { ip: "192.168.2.29", port: 502, unit: 103 }
      AcuRev4100_2: { ip: "192.168.2.242", port: 502, unit: 23 }
      AcuRev2100: { ip: "192.168.2.64",  port: 502, unit: 101 }
      AcuvimIIW: { ip: "192.168.2.27",  port: 502, unit: 2 }
      Acuvim3: { ip: "192.168.2.32",  port: 502, unit: 1 }

  # Modbus RTU 设备：列表形式，每条串口独立配置，挂载各自设备
  # 每项包含串口参数（port/baudrate/parity/stopbits/bytesize）和该串口下的 devices
  # 同一串口下同型号多台设备：使用不同 unit 地址区分，键名须唯一
  rtu:
    - port:     "COM3"
      baudrate: 9600
      parity:   "E"
      stopbits: 1
      bytesize: 8
      devices:
        AcuvimIIW_RTU: {unit: 1}

datalog:
  default_device: "AcuRev4100"
  tolerance_pct: 5.0
  tolerance_abs: 0.05
  push_timeout: 300

server:
  host: "192.168.2.45"
  ftp:
    port: 2121
    user: "datalog"
    password: "datalog123"
  sftp:
    port: 2222
    user: "datalog"
    password: "datalog123"
  http:
    port: 8080
  https:
    port: 8443
    cert: ""
    key: ""

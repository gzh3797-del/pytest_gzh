[pytest]
python_files = TestCase_*.py test_*.py
python_functions = test_*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    aws_iot: AWS IoT 相关测试
    slow: 需要等待网络/Modbus 的慢速测试
    manual: 需要手动操作的测试（自动化不执行）

# Allure 结果收集（每次执行自动清空旧结果，由 conftest.pytest_sessionfinish 生成带时间戳报告）
addopts = --alluredir=reports/allure-results --clean-alluredir

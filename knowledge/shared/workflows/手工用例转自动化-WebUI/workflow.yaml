# 工作流声明文件 —— 手工用例转自动化（Web UI · Playwright+pytest）
# 状态：草案，待试运行
# 说明：本文件把已跑通的 webtestcase_manual_to_auto skill 的隐性链"外显"为
#       可调度/可门禁/可记账/可续跑的工作流。业务逻辑仍全部在该 skill 内，
#       本工作流不重复、不覆盖 skill 的任何步骤，只在阶段之间加：入口校验 +
#       人工门禁（红色澄清 / 覆盖门禁验收）+ 运行记账。skill 自带的染色规则、
#       Step 4.5 覆盖门禁、严禁编造铁律保持权威。

workflow:
  id: wf-manual-to-auto-webui            # 唯一 ID，全工程不重复
  name: 手工用例转自动化-WebUI
  version: "0.1"
  owner: 待分配                          # 责任到人：本工作流维护负责人
  scope: 含 Web 页面的网关/电表项目（AcuHMI_1_7 / RPP 等）Web UI 手工用例转 Playwright 自动化
  trigger:
    - 某项目 Web UI 手工用例 Excel 需转 Playwright+pytest 自动化
    - 页面改版/新功能后需补齐或重跑对应 UI 自动化用例

  input:                                # 输入物：启动前必须齐备，缺则不启动
    - 用例集 Excel（含「模块/子模块/用例编号/步骤/预期/自动化(是否)/自动化类型」等列）
    - 目标项目（见 skill「项目映射」表，如 AcuHMI_1_7）+ 其 CONTEXT_DIR 选择器沉淀目录
    - 被测 Web 页面可访问（生成绿色用例后实跑+调试所需）

  scope_note: |                         # 执行范围（可选，启动时声明；默认整份可自动化用例）
    支持限定到单模块/多模块/单用例编号（对应 skill 的 --module / --case）。范围限定后全链
    只处理该范围，禁止顺带生成范围外模块。

  output:                               # 最终输出物及归档位置
    - Playwright pytest 脚本 → projects/<项目>/tests/<自动化类型>/test_<用例编号>.py（一条一文件）
    - Excel 回填 3 个 Claude 列（需补充信息/用户答复/自动化脚本调试结果，不动 A–P 现有列）
    - 新探明选择器增量沉淀 → <knowledge_root>/requirements/context/*_context.md
    - 运行记录 → knowledge/shared/workflows/runs/

# 所有人工 gate（executor: human 的阶段）通用呈现规则（全工程统一）：
gate_protocol:
  - 验收清单呈现给审核人时，复选框一律为 [ ]（留空）；[x] 只能由审核人的回复产生，AI 不得代勾——包括 AI 自查已通过的项
  - AI 可以（且鼓励）在 gate 前对客观项做自查，但自查结论与验收清单分开呈现，格式为「AI 自查：通过/不通过 + 证据」，勾选权留给人
  - 判断类条目（如"脚本语义是否与步骤一致"）AI 只提供抽样证据（如 Gate E 对照矩阵），不得下"通过"结论
  - 审核人回复通过时须明示（如"全过"或逐条答复），沉默或模糊回复不视为通过

stages:
  - id: S1
    name: 分析染色（定位 context + 逐条判红/绿/橙）
    executor: ai
    tool: /webtestcase_manual_to_auto      # 以 --analyze-only 跑到 skill 的 Step 3
    input: 用例集 Excel + 项目 CONTEXT_DIR
    output: |
      红/绿/橙染色写回 Excel「需补充信息」列 + 待澄清清单（红色：用例编号 → 根因/疑问）。
      严禁编造：无定位依据即标红记根因，不臆造选择器。
    gate: none
    note: |
      本阶段调用 skill 时带 --analyze-only；缺页面 context 时 skill 会转调 webpage_analyze 现场
      探查并沉淀 _context.md，属 skill 内既定行为，本工作流不干预。

  - id: S2
    name: 红色用例澄清（人工）
    executor: human
    role: 模块负责人
    input: S1 染色结果 + 待澄清清单
    output: 澄清后的用例判定（红→绿 或 保持红并书面豁免）
    gate:                               # 验收标准 = 过门条件，逐条可勾选
      - 红色用例已逐条处理：填「用户答复」列补齐缺失信息，或书面确认"该条不自动化"豁免
      - 绿色用例范围已确认（进入生成），无明显误判为绿的用例
      - 涉及不可复现设备状态/Factory Reset/固件升级的用例已确认走人工，不强转自动化
    on_fail: |
      A) 补澄清：审核人在「用户答复」列填写或对话答复后，AI 二次运行 S1 重判（懂了改绿、仍疑保持红）。
      B) 直接豁免：审核人明示某些红色用例本期不做，记入 runs 备注，跳过其生成。
      任一路径后重新过 S2。

  - id: S3
    name: 生成脚本 + 覆盖门禁自检 + 运行调试 + 回填 + 沉淀
    executor: ai
    tool: /webtestcase_manual_to_auto      # 续 skill Step 4~6（仅对绿色用例）
    input: S2 确认的绿色用例
    output: |
      test_*.py（先出探查约束表，locator/断言值均可追溯）；Step 4.5 五道覆盖门禁自检；
      pytest 运行 + 失败自动调试（≤3 轮）；回填「自动化脚本调试结果」列；
      新选择器增量沉淀回 *_context.md；产出 Step 7 汇报（含 Gate E 语义对照矩阵）。
    gate: none

  - id: S4
    name: 覆盖门禁与结果人工验收
    executor: human
    role: 模块负责人
    input: S3 脚本 + 覆盖门禁结论 + Gate E 对照矩阵 + pytest 结果
    output: 验收结论（通过/回炉）
    gate:
      - 覆盖门禁（Step 4.5）：每条步骤/预期逐条覆盖（零漏项），无"综合断言/只验第一行"凑数
      - Gate E 语义对照矩阵抽查：关键参数（身份/角色/输入值/目标对象/断言值）与步骤语义一致，无角色错配/填错对象
      - 配置副作用用例已在 finally 逐项还原（Gate D），非只删数据/登出
      - 「调试失败」项根因明确（门禁未过/元素缺失/需硬件），非误判；破坏性用例合理 skip
      - 无一次性探查脚本残留（CLAUDE.md 最高优先级禁止项）；只改 3 个 Claude 列、未动用例编号列
    on_fail: |
      A) 按结论回炉：AI 对指定用例补断言/改语义/重澄清（回 S3，≤3 轮预算内），重跑后重新交审。
      B) 工程师直接改 .py（保存关闭后声明"已手改，重新读取"），AI 重读文件、与后续改动做重叠判定。
      门禁 3 轮仍无法覆盖（如预期本身模糊）→ 转红记根因，不删步骤/不凑弱断言放行。

  - id: S5
    name: 运行记录归档（metrics 记账）
    # 存废检验点：跑满 5 单时，若 runs 数据拼不出转换率/首通率/门禁通过率/人时收益一页汇报，砍掉本阶段
    executor: ai
    input: 本次运行全过程（S1~S4 产物、回炉记录、验收改动、沉淀的 context）
    output: knowledge/shared/workflows/runs/<YYYYMMDD>-<项目>-<模块标识>.md
    action: |
      按 metrics 口径记成一条流水，字段：
      - 工作流/版本、项目、模块标识、执行日期
      - 各阶段一行一条（S2/S4 验收结果、回炉次数与原因、路径 A/B）
      - 染色分布原料：绿/红/橙/未分析条数；红色经澄清转绿条数
      - 转换率原料：可自动化条数 / 成功生成条数 / skip 条数
      - 门禁通过率原料：覆盖门禁首评 PASS 条数 / 生成条数；调试修复条数；调试失败条数（含门禁未过）
      - 沉淀原料：本单增量沉淀了哪些 *_context.md
      - 人时原料：会话总耗时/交互轮次自动记录；实际人工投入小时数**当场向工程师提问获取**，
        未答复留空标"待补"，禁止臆测代填
      归档后在对话里报一份摘要，单条记录控制在十余行，不得膨胀。本阶段不产出测试产物，禁止跳过。

metrics:                                # 质量评估：度量口径定义（由 S5 记录落盘）
  - name: 自动化转换率
    how: 成功生成（绿色且落盘）条数 / 可自动化（自动化==是）条数
  - name: 覆盖门禁首评通过率
    how: Step 4.5 首评即 PASS 条数 / 生成条数（衡量生成质量，越高越省返工）
  - name: 红色澄清转化率
    how: 经 S2 澄清由红转绿条数 / 初判红色条数（衡量 context 沉淀与需求清晰度）
  - name: 单模块转换人时
    how: 从 trigger 到 S4 完成的实际人工投入小时数（对比纯手工写脚本基线）；AI 只记原料，人时由工程师补填

# 工作流声明文件 —— 用例设计（示例兼模板）
# 状态：草案，待③议题评审
# 说明：本文件是"声明"，供评审与执行对照；跑通 2-3 个迭代后可翻译成
#       编排 skill 放 .claude/skills/，实现一句话触发整条链。
# 其他工作流复制本文件改写，字段含义见行内注释。

workflow:
  id: wf-testcase-design                # 唯一 ID，全工程不重复
  name: 用例设计工作流
  version: "0.1"
  owner: 待分配                          # ④责任到人：本工作流的维护负责人
  scope: 全工程所有项目的新需求用例产出   # 适用范围（哪些项目/哪类任务）
  trigger:                              # 什么情况下启动本工作流
    - 新需求文档下达
    - 版本需求变更（Release Notes 中含功能变更）

  input:                                # 输入物：启动前必须齐备，缺则不启动
    - 需求文档原件（requirements/raw/）或摘要（requirements/summaries/<版本>.md）
    - 项目知识库 context.md（strategy-design 取产品背景用）

  scope: |                              # 执行范围（可选，启动时声明；默认整份需求）
    支持限定到单模块/单章节，启动语句写明（如"范围：仅 §3.4 SNMP，其余模块不处理"）。
    限定后 S1~S7 全链只处理该范围：脑图只建该模块分支、用例只生成该模块编号段、
    查漏与基线比对以该范围需求为基准（范围外需求点不计漏）、产物文件名带模块标识。
    禁止超范围顺带生成相邻模块内容。

  output:                               # 最终输出物及归档位置
    - 测试用例 Excel → projects/<项目>/testcase/
    - 用例摘要 .md → 同目录（知识库 testcase 目录规则）

# 所有人工 gate（executor: human 的阶段）通用呈现规则：
gate_protocol:
  - 验收清单呈现给审核人时，复选框一律为 [ ]（留空）；[x] 只能由审核人的回复产生，AI 不得代勾——包括 AI 自查已通过的项
  - AI 可以（且鼓励）在 gate 前对客观项做自查，但自查结论与验收清单分开呈现，格式为「AI 自查：通过/不通过 + 证据」，勾选权留给人
  - 判断类条目（如"步骤可执行、预期可判定"）AI 只提供抽样证据（如随机抽 5 条列出），不得下"通过"结论
  - 审核人回复通过时须明示（如"4条全过"或逐条答复），沉默或模糊回复不视为通过

stages:
  - id: S1
    name: 测试点生成
    executor: ai                        # 执行者：ai / human
    tool: /strategy-design              # 用哪个 skill（executor=ai 时必填）
    input: 需求文档
    output: 测试策略脑图（XMind）
    gate: none                          # 无人工门禁，自动进入下一段

  - id: S2
    name: 测试点二元性评测
    executor: ai
    tool: /coverage-check               # strategy-design 末尾自动调用
    input: S1 脑图 + 需求文档 +（可选）S1 产出的知识库提取表
    output: 二元性评测预审报告（维度分+红线verdict+门槛档位+逐题结果+🔴/🟡/🟢三档漏点，对话内）
    gate: none                          # 红线FAIL/漏项由 S3 人工判定，AI 不自行改图

  - id: S3
    name: 测试点人工审核
    executor: human
    role: 模块负责人                     # 谁来审（角色而非具体人名）
    input: S1 脑图 + S2 查漏结论
    output: 审定后的测试点脑图
    gate:                               # 验收标准 = 过门条件，逐条可勾选
      - 「知识库提取表」已随脑图提交，各类别填写完整并注明来源（重点核设备清单是否落到具体型号）
      - S2 二元性评测预审报告已附；红线 verdict=FAIL 或总分<70 的项已回炉或书面豁免（分数仅预审建议、未校准、不替代人工签字）
      - 需求全部功能点在脑图中有对应测试点
      - S2 报出的高危漏项已补充或书面豁免
      - 边界/异常/断电恢复类场景无遗漏
      - 颗粒度与句式符合 strategy-design 规范；测试点与提取表事实一致
    on_fail: |                          # 三种回炉路径；任一路径完成后都必须重跑 S2、重新过 S3
      A) 按查漏结论回炉：AI 把审核人指定的漏项补进脑图，重跑 S2 后重新交审。
      B) 人工直接补点：审核人在 XMind 中补点、保存并关闭文件（AI 改盘期间
         不得在 XMind 中开着旧版本，防止后续保存覆盖 AI 改动），然后声明
         "已手补，重新读取脑图文件"，重跑 S2 后重新交审。
      C) 混合（人工手补 + AI 合并查漏项）：AI 必须先重新读盘，将手补内容与
         查漏结论做重叠判定——已被手补覆盖的漏项不得重复添加；把「已手补
         覆盖 / AI 新增」两栏清单交审核人确认后才写入脑图，随后重跑 S2、
         重新发 S3 验收清单。
      漏项原因与回炉路径记入 runs 记录备注（metrics 原料）。

  - id: S4
    name: 用例生成
    executor: ai
    tool: /testcase-design
    input: S3 审定脑图
    output: 测试用例 Excel（.xlsx）

  - id: S5
    name: 用例二元性评测
    executor: ai
    tool: /coverage-check
    input: S4 用例 + S3 审定脑图 +（可选）S4 产出的知识库提取表
    output: 二元性评测预审报告（维度分+红线verdict+门槛档位+逐题结果+🔴/🟡/🟢三档漏点，对话内）

  - id: S6
    name: 用例人工审核
    executor: human
    role: 模块负责人
    input: S4 用例 + S5 查漏结论
    output: 终版测试用例 Excel
    gate:
      - 「知识库提取表」已随用例提交，各类别填写完整（重点核编号续接区间与设备型号）
      - S5 二元性评测预审报告已附；红线 verdict=FAIL 或总分<70 的项已回炉或书面豁免（分数仅预审建议、未校准、不替代人工签字）
      - 每个测试点至少一条用例，编号符合用例编号规范且从已有区间续接
      - 步骤可执行、预期结果可判定（无"正常""正确"类模糊表述），设备均为具体型号
      - 优先级标注完整（LV0/LV1/LV2/LV4）
      - "是否可自动化"列已标注（供后续自动化转换工作流消费）
    on_fail: |                          # 回炉路径比照 S3：A 回 S4 重生成对应模块 /
      B 人工直接修订 Excel（保存关闭后声明"已手改，重新读取"）/
      C 混合时 AI 先重读文件→与查漏结论重叠判定→「已手改覆盖 / AI 新增」
      清单经审核人确认后写入，随后重跑 S5、重新过 S6。

  - id: S7
    name: 运行记录归档（metrics 记账）
    # 存废检验点：跑满 5 单时，若 runs 数据拼不出一页收益汇报（采纳率/人时对比），砍掉本阶段
    executor: ai                        # 无 gate，S6 通过后自动执行，做完流程才算结束
    input: 本次运行全过程（S1~S6 的产物、回炉记录、审核改动）
    output: knowledge/shared/workflows/runs/<YYYYMMDD>-<项目>-<需求标识>.md
    action: |
      按 metrics 口径把本次运行记成一条流水，字段：
      - 工作流/版本、项目、需求标识、执行日期
      - 各阶段结论一行一条（S3/S6 审核结果、回炉次数与原因、路径 A/B/C）
      - AI 初稿采纳率原料：S3/S6 人工改动条数 / 总条数（含回炉补充项数）
      - 人时原料：会话总耗时、人工交互轮次自动记录；实际人工投入小时数
        **当场向执行工程师提问获取**（"这单你实际投入了多少人时？"），
        得到答复后填入；未答复则留空标注"待补"，禁止臆测代填
      - 漏测逃逸：留空占位，版本结束后由 Jira 反查回填（后续挂到版本测试
        工作流收尾阶段触发，不依赖人记忆）
      归档后在对话里报一份摘要。单条记录控制在十行左右，不得膨胀。
      本阶段不产出测试产物，禁止跳过。

metrics:                                # ⑤质量评估：度量口径定义（由 S7 负责记录落盘）
  - name: AI 初稿采纳率
    how: 人工审核阶段（S3/S6）改动条数 / 总条数，低改动率=高采纳
  - name: 单需求产出人时
    how: 从 trigger 到 S6 完成的实际人工投入小时数（对比纯手工基线）；AI 只记原料，人时由工程师补填
  - name: 漏测逃逸
    how: 后续版本发现"本应在此需求覆盖"的漏测 bug 数（Jira 反查，版本结束后回填 runs 记录）

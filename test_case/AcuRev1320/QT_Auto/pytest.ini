[pytest]
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = -v --html=reports/test_report.html --self-contained-html --show-capture=all --capture=sys
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    screenshot: tests with screenshots
    slow: marks tests as slow
    dependency: marks tests as having dependencies